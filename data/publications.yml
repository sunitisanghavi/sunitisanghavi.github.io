- title: "Multi-epoch ultraviolet observables for breaking the radius–albedo degeneracy in directly imaged exoplanets"
  authors: "S. Sanghavi, R. A. West, P. Chen"
  venue: "arXiv:2608.06649 (submitted)"
  year: 2026
  arxiv: "2608.06649"
  pdf: "Sanghavi_2026_arXiv_2608.06649.pdf"
  theme: "planets software"
  type: preprint
  selected: true
  key: "sanghavi2026hwo"
  summary: >-
    Brightness alone cannot distinguish a large, dark planet from a small, bright one. It
    constructs radius-independent observables: the normalized 400 nm lightcurve shape,
    ultraviolet intensity and polarization colors, and degree of linear polarization. In the
    360–400 nm window, where Rayleigh scattering dominates and bright surfaces are nearly
    colorless, these constrain the atmospheric column, surface reflectivity and phases before
    the radius is inferred. With six epochs and unknown phases, median radius errors are 14 %,
    3.2 % and 0.47 % at S/N 5, 20 and 100. This gives an observing path to radii of
    non-transiting HWO targets and argues for a window shortward of 400 nm.
  figure: "sanghavi2026hwo.png"
  figcaption: "Fractional radius uncertainty versus S/N for six-phase HWO campaigns of solar twins at 6 and 12 pc, with and without polarimetry, for three Rayleigh optical depths. Fig. 10 of the paper."

- title: "Isolating Cabannes and rotational Raman scattering to determine forward modeling error due to Rayleigh scattering in the Earth's atmosphere"
  authors: "S. Sanghavi"
  venue: "Journal of Quantitative Spectroscopy and Radiative Transfer, 363, 110077"
  year: 2026
  doi: "10.1016/j.jqsrt.2026.110077"
  pdf: "Sanghavi_2026_JQSRT_Cabannes.pdf"
  theme: "theory"
  type: article
  key: "sanghavi2026cabannes"
  summary: >-
    Models usually treat molecular scattering as Rayleigh scattering. This paper shows that
    this monochromatic approximation is biased where the spectrum is structured, because
    molecular scattering consists of elastic Cabannes and rotational Raman scattering. It
    derives the Cabannes single-scattering albedo and depolarization ratio of N₂, O₂ and air
    from Placzek's theory and resolves both components in vSmartMOM. For the O₂ A-band, used
    to constrain airmass in greenhouse-gas retrievals and by FLEX for fluorescence, it
    quantifies how the bias depends on surface brightness, pressure, geometry and aerosol and
    proposes a lookup-table correction. This matters for hyperspectral observations from the
    ultraviolet to near-infrared.
  figure: "sanghavi2026cabannes.png"
  figcaption: "When the Rayleigh formulation fails: molecular scattering (Cabannes + rotational Raman) compared with the Rayleigh approximation for a flat solar spectrum without absorption (left), the real solar spectrum with Fraunhofer lines (middle) and the solar spectrum plus O₂ A-band absorption (right), for three surface albedos. Fig. 2 of the paper (CC BY-NC)."

