- title: "Retrieval of the optical depth and vertical distribution of particulate scatterers in the atmosphere using O₂ A- and B-band SCIAMACHY observations over Kanpur"
  authors: "S. Sanghavi, J. V. Martonchik, J. Landgraf, U. Platt"
  venue: "Atmospheric Measurement Techniques, 5, 1099–1119"
  year: 2012
  doi: "10.5194/amt-5-1099-2012"
  pdf: "Sanghavi2012AMT.pdf"
  theme: "earth"
  type: article
  key: "sanghavi2012amt"
  summary: >-
    The O₂ A-band has long been used to estimate aerosol and cloud vertical distributions from
    space. This paper adds part of the B-band, also measured by SCIAMACHY, to an
    optimal-estimation retrieval of particulate optical thickness and lognormal vertical
    profile over bright and dark surfaces. Information-content analysis shows the B-band adds
    vertical information, because its absorption strength and surface albedo differ from the
    A-band's. Applied to Kanpur in 2003, retrieved monthly optical thicknesses correlate with
    AERONET (r = 0.92, non-monsoon months). Radiometric uncertainties and computational cost
    limited application to this case study, which nevertheless showed a stable, physics-based
    aerosol-profile retrieval from SCIAMACHY alone.
  figure: "sanghavi2012amt.png"
  figcaption: "Retrieved peak heights of the particulate layer over Kanpur in 2003 with FWHM band (top), and all retrieved lognormal vertical profiles colored by season (bottom). Fig. 10 of the paper."

- title: "Bichromatic method for identification of clear-sky scenarios over ground pixel viewed from space"
  authors: "S. Sanghavi, U. Platt, J. Landgraf"
  venue: "Applied Optics, 49(17), 3282"
  year: 2010
  doi: "10.1364/ao.49.003282"
  theme: "earth"
  type: article
  key: "sanghavi2010ao"
  summary: >-
    This paper identifies clear-sky scenes in a satellite time series over a pixel with
    unknown albedo and aerosol type. Reflectance does not vary monotonically with aerosol
    loading, so observations cannot simply be ranked by it. Treating each observation as
    aerosol-free, the relative contrast between the resulting Lambertian equivalent albedos at
    two wavelengths of different surface albedo varies monotonically with aerosol. Applied to
    SCIAMACHY data over a non-dark surface, it is validated against measured and modeled O₂ A-
    and B-band absorption. Independent of surface brightness and aerosol type, it applies
    across instruments; the 2012 SCIAMACHY retrieval confirmed its premise.
  figure: "sanghavi2010ao.png"
  figcaption: "Apparent Lambertian albedos at 682 and 755 nm from SCIAMACHY over Kanpur in 2003 and their relative contrast; vertical lines mark likely clear-sky days. Fig. 5 of the paper."

