- title: "Impact of Raman scattering on SIF retrievals from hyperspectral satellite observations"
  authors: "S. Sanghavi, C. Frankenberg, R. Nelson, C. O'Dell, R. Rosenberg, J. Joiner"
  venue: "Geophysical Research Letters, 52, e2024GL112777"
  year: 2025
  doi: "10.1029/2024gl112777"
  theme: "theory earth"
  type: article
  selected: true
  key: "sanghavi2025sif"
  summary: >-
    Solar-induced chlorophyll fluorescence (SIF) is retrieved from the filling-in of solar
    Fraunhofer lines, which inelastic (Raman) scattering of sunlight also produces. Polarized
    radiative transfer simulations of nadir observations near the O₂ A-band show that
    inelastic scattering causes spurious SIF of up to 0.35 mW m⁻² sr⁻¹ nm⁻¹ over
    vegetation-free regions such as the Sahara, Greenland and Antarctica. Zero-level offset
    corrections leave residual biases of about ±0.15 mW m⁻² sr⁻¹ nm⁻¹ that correlate with
    surface brightness, elevation and viewing geometry. A simulation-based lookup table
    subtracts the inelastic contribution; at publication it was being incorporated into the
    operational OCO-2/3 products. Red SIF retrievals (GOME-2, TROPOMI, FLEX) are most
    affected.
  figure: "sanghavi2025sif.png"
  figcaption: "Modeled Raman-scattering bias in SIF retrievals, uncorrected (left) and after the standard OCO-2 zero-level offset correction (right). Fig. 3b of the paper."

